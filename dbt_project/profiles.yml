hospital_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USER', 'hospital_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'hospital_password') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('POSTGRES_DB', 'hospital_db') }}"
      schema: marts
      threads: 4
      keepalives_idle: 0
